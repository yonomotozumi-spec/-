# 株式自動取引システム 運用設定

# 監視・売買対象の銘柄 (yfinance ティッカー形式。東証は .T を付ける)
universe:
  - 7203.T   # トヨタ自動車
  - 6758.T   # ソニーグループ
  - 9984.T   # ソフトバンクグループ
  - 8306.T   # 三菱UFJフィナンシャル・グループ
  - 6501.T   # 日立製作所

# 初期資金 (円)
initial_capital: 500000

# データ取得
data:
  lookback_days: 400        # 指標計算に使う過去日数
  interval: "1d"

# リスク管理
risk:
  max_position_weight: 0.25   # 資金50万では分散に限界があるため25%まで許容
  max_gross_exposure: 0.95
  stop_loss_pct: 0.08         # 取得価格から-8%で損切り
  take_profit_pct: 0.0        # 固定利確は無効 (上値を切らない)
  trailing_stop_pct: 0.12     # 高値から-12%で利確 (実データ検証でSharpe最良)
  max_daily_var_pct: 0.03     # ポートフォリオ日次VaR(95%)は3%まで
  risk_free_rate: 0.001       # 無リスク金利 (年率)

# 戦略の重み (シグナル統合時)
strategy:
  momentum_weight: 0.6
  mean_reversion_weight: 0.4
  buy_threshold: 0.30
  sell_threshold: -0.35       # これ以下でSELL

# 執行
execution:
  mode: paper                 # paper のみサポート (実運用はアダプタ実装が必要)
  commission_pct: 0.0005      # 手数料 0.05%
  slippage_pct: 0.0022      # 単元未満株のスプレッド相当 (楽天かぶミニ0.22%を想定した保守値)
  lot_size: 1                 # 1株単位 (SBI S株・楽天かぶミニ等の単元未満株を前提)

# 状態保存
state_file: state/portfolio.json

# 銘柄スクリーニング (候補プールから月次でユニバースを自動選定)
screener:
  enabled: true
  candidates_file: config/candidates.yaml
  target_count: 8             # 採用銘柄数
  min_turnover_jpy: 1000000000  # 60日平均売買代金 10億円/日 以上
  max_per_sector: 2           # 同一セクターは2銘柄まで
  refresh_days: 30            # 30日毎に再選定
  universe_file: state/universe.json
