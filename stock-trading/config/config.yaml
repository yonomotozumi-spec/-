# 株式自動取引システム 運用設定

# 監視・売買対象の銘柄 (yfinance ティッカー形式。東証は .T を付ける)
universe:
  - 7203.T   # トヨタ自動車
  - 6758.T   # ソニーグループ
  - 9984.T   # ソフトバンクグループ
  - 8306.T   # 三菱UFJフィナンシャル・グループ
  - 6501.T   # 日立製作所

# 初期資金 (円)
initial_capital: 3000000

# データ取得
data:
  lookback_days: 400        # 指標計算に使う過去日数
  interval: "1d"

# リスク管理
risk:
  max_position_weight: 0.20   # 1銘柄あたり最大20%
  max_gross_exposure: 0.90    # 株式合計は資産の90%まで (現金10%を常に確保)
  stop_loss_pct: 0.08         # 取得価格から-8%で損切り
  take_profit_pct: 0.20       # +20%で利確
  max_daily_var_pct: 0.03     # ポートフォリオ日次VaR(95%)は3%まで
  risk_free_rate: 0.001       # 無リスク金利 (年率)

# 戦略の重み (シグナル統合時)
strategy:
  momentum_weight: 0.6
  mean_reversion_weight: 0.4
  buy_threshold: 0.35         # 統合スコアがこれ以上でBUY
  sell_threshold: -0.35       # これ以下でSELL

# 執行
execution:
  mode: paper                 # paper のみサポート (実運用はアダプタ実装が必要)
  commission_pct: 0.0005      # 手数料 0.05%
  slippage_pct: 0.0005        # スリッページ 0.05%

# 状態保存
state_file: state/portfolio.json
