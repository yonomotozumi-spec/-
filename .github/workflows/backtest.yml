name: Backtest Real Data

on:
  workflow_dispatch:
    inputs:
      start:
        description: "バックテスト開始日 (YYYY-MM-DD)"
        required: false
        default: "2023-09-01"

permissions:
  contents: write

concurrency:
  group: stock-trading-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backtest with real market data
        run: |
          python main.py backtest --start "${{ inputs.start || '2023-09-01' }}" \
            --out reports/backtest-latest.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "backtest: 実データバックテスト結果を更新"
          git push
